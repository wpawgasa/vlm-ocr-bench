kind: bankstmt
input_dir: /data/statements
banks: [kbank, scb, bbl, ktb, krungsri, ttb, gsb, uob]
bank_map:
  "*kbank*": kbank
  "*kasikorn*": kbank
  "*scb*": scb
  "*bbl*": bbl
  "*bangkok*": bbl
  "*ktb*": ktb
  "*krungthai*": ktb
  "*krungsri*": krungsri
  "*bay*": krungsri
  "*ttb*": ttb
  "*gsb*": gsb
  "*omsin*": gsb
  "*uob*": uob
# Per-bank overrides for what the page's words cannot reveal (task 5.2); row parsing
# itself is bank-agnostic.
overrides:
  ttb:
    signed_amount: true
  kbank:
    amount_column_split: true
