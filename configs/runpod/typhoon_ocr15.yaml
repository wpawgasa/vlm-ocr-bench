# Runpod serving facts for typhoon-ocr1.5-2b (design D2); compose service `typhoon`.
# weights.revision stays REQUIRED (fails validation) until task 5.4 pins the commit.
model: typhoon_ocr15
image:
  base: vllm/vllm-openai@sha256:014a95f21c9edf6abe0aea6b07353f96baa4ec291c427bb1176dc7c93a85845c
  vllm_version: "0.11.0"
  variant: plain
weights:
  repo: typhoon-ai/typhoon-ocr1.5-2b
  revision: REQUIRED
vllm_args:
  dtype: bfloat16
  max-model-len: 16384
  limit-mm-per-prompt: '{"image": 1}'
  gpu-memory-utilization: 0.9
  seed: 0
  max-logprobs: 5
endpoint:
  kind: load_balancing
  gpu_types: ["NVIDIA L4", "NVIDIA RTX A5000", "NVIDIA GeForce RTX 3090"]
  workers_min: 0
  workers_max: 3
  idle_timeout_s: 120
  scaler: {type: REQUEST_COUNT, value: 4}
  flashboot: true
  data_centers: []
  cuda_min: "12.8"
  container_disk_gb: 30
client:
  max_concurrency: 4
  request_timeout_s: 120
  cold_start_wait_s: 600
  max_request_mb: 25
slo:
  page_p50_s: 6
  page_p95_s: 20
  cold_start_p95_s: 90
