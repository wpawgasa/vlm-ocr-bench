# Runpod serving facts for OvisOCR2 (design D2); compose service `ovisocr2`, vLLM 0.22.1.
# TODO(task 6.1/5.4): image.base is REQUIRED until the vllm/vllm-openai:v0.22.1 digest is
# resolved (needs registry access); weights.revision is pinned in task 5.4. Both fail validation.
model: ovisocr2
image:
  base: vllm/vllm-openai@sha256:REQUIRED
  vllm_version: "0.22.1"
  variant: plain
weights:
  repo: ATH-MaaS/OvisOCR2
  revision: REQUIRED
vllm_args:
  gdn-prefill-backend: triton
  dtype: bfloat16
  max-model-len: 32768
  limit-mm-per-prompt: '{"image": 1}'
  gpu-memory-utilization: 0.9
  seed: 0
  max-logprobs: 5
endpoint:
  kind: load_balancing
  gpu_types: ["NVIDIA L4", "NVIDIA RTX A5000", "NVIDIA GeForce RTX 3090"]
  workers_min: 0
  workers_max: 3
  idle_timeout_s: 120
  scaler: {type: REQUEST_COUNT, value: 4}
  flashboot: true
  data_centers: []
  cuda_min: "12.8"
  container_disk_gb: 30
client:
  max_concurrency: 4
  request_timeout_s: 120
  cold_start_wait_s: 600
  max_request_mb: 25
slo:
  page_p50_s: 6
  page_p95_s: 20
  cold_start_p95_s: 90
