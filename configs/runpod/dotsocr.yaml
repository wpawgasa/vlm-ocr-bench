# Runpod serving facts for dots.ocr (design D2). vllm_args mirror the compose service
# `dotsocr` minus --model, --served-model-name and --gpu-memory-utilization (tests check this).
# weights.revision is the Hugging Face commit pinned by task 5.4 (2026-10-19).
model: dotsocr
image:
  base: vllm/vllm-openai@sha256:014a95f21c9edf6abe0aea6b07353f96baa4ec291c427bb1176dc7c93a85845c
  vllm_version: "0.11.0"
  variant: plain
weights:
  repo: dots-studio/dots.ocr
  revision: c0111ce6bc07803dbc267932ffef0ae3a51dc951
vllm_args:
  trust-remote-code: true
  dtype: bfloat16
  max-model-len: 16384
  limit-mm-per-prompt: '{"image": 1}'
  gpu-memory-utilization: 0.9
  seed: 0
  max-logprobs: 5
endpoint:
  kind: load_balancing
  gpu_types: ["NVIDIA L4", "NVIDIA RTX A5000", "NVIDIA GeForce RTX 3090"]
  workers_min: 0
  workers_max: 2
  idle_timeout_s: 120
  scaler: {type: REQUEST_COUNT, value: 4}
  flashboot: true
  data_centers: ["EU-RO-1", "EU-SE-1", "EU-CZ-1", "EUR-IS-1", "EUR-IS-2", "CA-MTL-1", "US-CA-2", "US-GA-2", "US-IL-1", "US-MO-2"]
  cuda_min: "12.8"
  container_disk_gb: 30
client:
  max_concurrency: 4
  request_timeout_s: 120
  cold_start_wait_s: 600
  max_request_mb: 25
slo:
  # revised from the 24 GB measurement (task 6.2, 2026-10-20); page targets exclude pages
  # that reach sampling.max_tokens (generation loops, design D7)
  page_p50_s: 10
  page_p95_s: 30
  cold_start_p95_s: 120
