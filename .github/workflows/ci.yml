name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Same image as the former Drone pipeline: Python 3.11 + uv on Debian bookworm.
    container: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4
      # poppler: pdffonts/pdftoppm/pdftotext for the bank-statement ingestion tests
      # git: issue-runner end-to-end tests; shellcheck: lints scripts/run_issue*
      - name: System packages
        run: apt-get update && apt-get install -y --no-install-recommends poppler-utils git shellcheck
      - name: Install
        run: uv sync --all-extras --frozen
      # NLTK METEOR (official ThaiOCRBench scorer) needs WordNet
      - name: NLTK data
        run: uv run python -m nltk.downloader -q wordnet omw-1.4
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest -m "not live"

  # Secret scan over the full history (design D9 "Keys"); rules in .gitleaks.toml.
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "${tarball}" gitleaks
      - name: Scan
        run: ./gitleaks git . --redact --no-banner --verbose
