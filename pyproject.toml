[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr-bench"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6",
  "openai>=1.40",
  "httpx>=0.27",
  "datasets>=2.20",
  "pdfplumber>=0.11",
  "pillow>=10",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "pythainlp>=5.0",
  "rapidfuzz>=3.9",
  "apted>=1.0.3",
  "lxml>=5",
  "scikit-learn>=1.5",
  "imagehash>=4.3",
  "openpyxl>=3.1",
  "matplotlib>=3.9",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "dvc[gs]>=3.50",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
ocrbench = "ocr_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ocr_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs running vLLM servers"]
addopts = "-m 'not live'"
